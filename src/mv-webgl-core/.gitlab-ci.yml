image: node:12.13.0-stretch-slim

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

stages:
  - lint
  - test
  - build


before_script:
  - echo "Install dependencies"
  - npm install

lint core:
  stage: lint
  script:
    - echo "Run linting"
    - npm run lint

test core:
  stage: test
  script:
    - echo "Run tests"
    - echo "Install dependecies for Chrome headless"
    - apt-get update && apt-get install -yq libgconf-2-4
    - apt-get install -y libasound2 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgcc1 libgconf-2-4 libgdk-pixbuf2.0-0 libglib2.0-0 libgtk-3-0 libnspr4 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 ca-certificates fonts-liberation libappindicator1 libnss3 lsb-release xdg-utils
    - apt-get install -y chromium chromium-l10n
    - export CHROME_BIN=/usr/bin/chromium
    - echo "Run unit tests"
    - npm run test:headless
  #coverage: '/Lines\s+:\s+(\d+\.\d+)%.*/'
  artifacts:
    paths:
      - coverage/
    expire_in: 3 day

build core:
  stage: build
  script:
    - echo "Run Web-Gl-Core build"
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

build docs:
  stage: build
  script:
    - echo "Run docs build"
    - npm run docs
  artifacts:
    paths:
      - docs/
    expire_in: 1 week
